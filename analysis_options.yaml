# Additional analysis options for this package.
#
# The `lints` package is the Dart-flavored base of `flutter_lints`; this
# package is pure Dart (no Flutter SDK dependency), so `package:lints` is the
# correct recommended set. On top of it we enable strict language modes and
# rules that keep the public API documented and idiomatic.
include: package:lints/recommended.yaml

analyzer:
  # example/ is a separate Flutter package with its own toolchain: it is
  # resolved with `flutter pub get` and analyzed by the flutter-example CI
  # job (`flutter analyze` inside example/). Without this exclude, plain
  # `dart analyze` at the root builds an unresolved Flutter context for it
  # on machines without the Flutter SDK and floods the output with URI
  # errors.
  exclude:
    - example/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Public API documentation (dartdoc must cover 100% of public members).
    - public_member_api_docs
    # Immutability / final-first style.
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_final_fields
    # Correctness extras that pay for themselves in an SDK.
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - literal_only_boolean_expressions
    - no_duplicate_case_values
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - use_string_buffers
    - use_super_parameters
