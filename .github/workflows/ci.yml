# Continuous integration for flutter_deepgram.
#
# Two jobs:
#   analyze-and-test — the quality gate for the package itself
#     (format, analyze, full test suite with coverage, pana score).
#   flutter-example  — keeps the example/ app compiling under stable Flutter.
#
# Matrix note: the package's SDK floor for CONSUMERS is Dart >=3.3.0
# (web_socket_channel 3.x + dart:js_interop conditional import, see
# pubspec.yaml). The CI matrix floor is 3.13.5 instead, because the dev
# toolchain (lints 6.1.0) requires Dart >=3.13.5 — a 3.3.0 leg would fail
# `dart pub get` while resolving dev_dependencies before running a single
# test.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.13.5, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve dependencies
        # --no-example: current pub versions resolve the example/ app (a
        # Flutter package) in addition to the root when running `dart pub
        # get` here. Under the pure Dart SDK installed by setup-dart that
        # extra resolution fails (`flutter_test from sdk` doesn't exist)
        # after the root package has already resolved, and the step exits
        # non-zero. The example is resolved and analyzed by the
        # flutter-example job below.
        run: dart pub get --no-example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: dart test --coverage=coverage

      - name: Convert coverage to lcov
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib \
            --packages=.dart_tool/package_config.json

      - name: Coverage summary
        run: python3 tool/coverage.py coverage/lcov.info --lib-root ".*/flutter_deepgram/"
        # tool/coverage.py also accepts `--min <pct>` to fail below a floor;
        # enable once you want to lock the current bar in.

      - name: Upload coverage artifact
        if: matrix.sdk == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: pana score report
        if: matrix.sdk == 'stable'
        run: |
          dart pub global activate pana
          pana --no-dartdoc .
        # Informational: prints the pub.dev analysis and score. To make CI
        # fail on any deduction, run `pana --no-dartdoc --exit-code-threshold 0 .`

  flutter-example:
    name: Flutter example (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze --fatal-infos

  # Android APK smoke build — disabled for now. example/android/ exists, but
  # the standard Flutter template .gitignore (example/android/.gitignore)
  # ignores gradlew, gradlew.bat and gradle-wrapper.jar, so a fresh checkout
  # has no Gradle wrapper. To enable this job: regenerate the wrapper inside
  # example/ (e.g. `flutter create --platforms=android .`), stop ignoring and
  # commit gradlew + gradle/wrapper/gradle-wrapper.jar, confirm
  # `flutter build apk --debug` locally, then uncomment below.
  #
  # apk-example:
  #   name: Example APK (debug)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         channel: stable
  #         cache: true
  #
  #     - name: Build debug APK
  #       working-directory: example
  #       run: flutter build apk --debug
