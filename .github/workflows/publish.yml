# Automated publishing to pub.dev via GitHub Actions OIDC ("trusted
# publishing"). No long-lived secrets are involved: pub.dev verifies a
# short-lived OIDC token minted by GitHub for this exact workflow run.

name: Publish to pub.dev

on:
  push:
    tags:
      # Must align with the tag pattern configured on pub.dev: 'v{{version}}'.
      # The trailing * also admits prerelease tags such as v1.2.3-rc.1 (as
      # long as the pubspec version is the same 1.2.3-rc.1).
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write # Required for authentication using OIDC.

jobs:
  publish:
    name: Publish tag ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # GitHub deployment environment (see one-time setup note #3 above).
    environment: pub-dev
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - name: Resolve dependencies
        # --no-example: plain `dart pub get` also resolves example/ (a
        # Flutter app), which fails under the pure Dart SDK and would abort
        # the publish before it starts. See ci.yml for the full story.
        run: dart pub get --no-example

      - name: Publish dry run (validates the package before uploading)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
